project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - assets/fonts/*
    - assets/interactive/*
    - assets/img/logos/*

website:
  title: "Martin Zach"
  description: "Research on system dynamics, urban mobility and climate adaptation and mitigation – projects, notes and observations."
  site-url: "https://mzach.eu"
  favicon: assets/img/favicon.svg
  open-graph: true
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: Notes
        href: posts/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Publications
        href: publications.qmd
      - text: About
        href: about.qmd
    right:
      - icon: rss
        href: posts/index.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Martin Zach"
    right:
      - text: Impressum & privacy
        href: impressum.qmd
      - text: RSS
        href: posts/index.xml

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss, assets/light.scss]
      dark: [cosmo, assets/theme.scss, assets/dark.scss]
    respect-user-color-scheme: true
    css: assets/fonts.css
    include-in-header:
      text: |
        <link rel="alternate" type="application/rss+xml" title="Martin Zach – notes" href="https://mzach.eu/posts/index.xml">
        <script type="application/ld+json">
        {"@context":"https://schema.org","@type":"Person","name":"Martin Zach","url":"https://mzach.eu/","image":"https://mzach.eu/assets/img/martin-zach.jpg",
         "jobTitle":"Researcher","worksFor":{"@type":"Organization","name":"AIT Austrian Institute of Technology","url":"https://www.ait.ac.at/"},
         "knowsAbout":["System dynamics","Urban mobility","Climate adaptation","Climate mitigation","Shared mobility"],
         "sameAs":["https://orcid.org/0000-0002-6487-1468","https://www.linkedin.com/in/martin-zach-571bb56","https://github.com/martnzach-wq"]}
        </script>
    toc: false
    smooth-scroll: true
    lang: en-GB
